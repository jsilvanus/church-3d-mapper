<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church 3D Venue Mapper</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="top-nav">
    <div class="brand">
      <span class="logo">⛪</span>
      <h1>Church 3D Mapper</h1>
      <span class="subtitle">PiSpace Venue Model Authoring</span>
    </div>

    <!-- View Mode Switcher -->
    <div class="view-switch">
      <button id="btnView2D" class="view-mode-btn active" title="2D Top-Down CAD Floorplan">📐 2D CAD Plan</button>
      <button id="btnView3D" class="view-mode-btn" title="3D Spatial Perspective Orbit Mode">🌐 3D Orbit View</button>
    </div>

    <div class="actions">
      <select id="templateSelect">
        <option value="">Load Template...</option>
        <option value="keskuskirkko">Riihimäen Keskuskirkko</option>
        <option value="standard-hall">Standard Rectangular Hall</option>
      </select>
      <button id="btnLoadFile" class="btn secondary">Open JSON</button>
      <input type="file" id="fileInput" accept=".json" style="display: none;">
      <button id="btnValidate" class="btn secondary">Validate</button>
      <button id="btnExport" class="btn primary">Export venue.json</button>
      <button id="btnPushPiSpace" class="btn accent">Push to PiSpace</button>
    </div>
  </header>

  <div class="workspace">
    <!-- Toolbar -->
    <aside class="toolbar">
      <button class="tool-btn active" data-tool="select" title="Select & Inspect Object">
        <span class="icon">↖</span>
        <span>Select</span>
      </button>
      <button class="tool-btn" data-tool="move" title="Move Object (Translate X/Y)">
        <span class="icon">✥</span>
        <span>Move</span>
      </button>
      <button class="tool-btn" data-tool="add-zone" title="Draw 3D Spatial Zone">
        <span class="icon">⬡</span>
        <span>Add Zone</span>
      </button>
      <button class="tool-btn" data-tool="add-floor" title="Draw Elevated Floor Platform (e.g. Altar Dais)">
        <span class="icon">🪜</span>
        <span>Floor</span>
      </button>
      <button class="tool-btn" data-tool="add-wall" title="Draw Wall or Open-Bottom Arch Header">
        <span class="icon">🧱</span>
        <span>Wall</span>
      </button>
      <button class="tool-btn" data-tool="add-camera" title="Place PTZ Camera">
        <span class="icon">📷</span>
        <span>Camera</span>
      </button>
      <button class="tool-btn" data-tool="add-occluder" title="Place 3D Occluder (Keymask Holdout Mesh)">
        <span class="icon">🛡</span>
        <span>Occluder</span>
      </button>
      <hr>
      <div class="zoom-controls">
        <button id="btnZoomIn" title="Zoom In">+</button>
        <button id="btnZoomReset" title="Reset View">1:1</button>
        <button id="btnZoomOut" title="Zoom Out">-</button>
      </div>
    </aside>

    <!-- Canvas Area -->
    <main class="canvas-container">
      <canvas id="mapCanvas"></canvas>
      <div id="viewport3d" style="display: none; width: 100%; height: 100%; position: absolute; inset: 0;"></div>
      <div class="canvas-overlay-hints">
        <span id="coordsDisplay">X: 0.00 m, Y: 0.00 m</span>
        <span id="modeDisplay">Mode: Select</span>
      </div>
      <!-- 3D Camera / POV Presets Overlay -->
      <div id="view3dControls" class="view-3d-overlay" style="display: none;">
        <button id="btn3dFocusAltar" class="view-pill" title="Focus camera on Altar / Chancel">Focus Altar</button>
        <button id="btn3dFocusPulpit" class="view-pill" title="Focus camera on Pulpit">Focus Pulpit</button>
        <button id="btn3dFocusChoir" class="view-pill" title="Focus camera on Choir">Focus Choir</button>
        <button id="btn3dGhostWalls" class="view-pill" title="Toggle translucent ghost walls">👁 Ghost Walls</button>
        <button id="btn3dReset" class="view-pill" title="Reset to high oblique view">Reset Orbit</button>
      </div>
    </main>

    <!-- Properties Panel -->
    <aside class="inspector">
      <h2>Venue Properties</h2>
      <div class="form-group">
        <label>Venue Name</label>
        <input type="text" id="venueName" value="Riihimäen Keskuskirkko">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Width (m)</label>
          <input type="number" id="dimWidth" value="16.0" step="0.5">
        </div>
        <div class="form-group">
          <label>Length (m)</label>
          <input type="number" id="dimLength" value="30.0" step="0.5">
        </div>
      </div>
      <div class="form-group">
        <label>Origin (0,0,0) Description</label>
        <input type="text" id="originDesc" value="Sanctuary floor at communion rail center">
      </div>

      <hr>

      <!-- Selected Item Inspector -->
      <div id="selectionInspector">
        <h3>Selection Inspector</h3>
        <p class="empty-hint">Select a zone, camera, wall, floor, or occluder to inspect and edit.</p>
        <div id="itemEditor" style="display: none;">
          <div class="form-group">
            <label>ID</label>
            <input type="text" id="itemId">
          </div>
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="itemName">
          </div>
          <div id="zoneFields">
            <div class="form-row">
              <div class="form-group">
                <label>Floor Z (m)</label>
                <input type="number" id="zoneFloor" step="0.1">
              </div>
              <div class="form-group">
                <label>Ceiling Z (m)</label>
                <input type="number" id="zoneCeiling" step="0.5">
              </div>
            </div>
            <div class="form-group">
              <label>Color</label>
              <input type="color" id="zoneColor">
            </div>
            <div class="form-group">
              <label>Tags (comma separated)</label>
              <input type="text" id="zoneTags">
            </div>
          </div>
          <div id="floorFields" style="display: none;">
            <div class="form-row">
              <div class="form-group">
                <label>Elevation Z (m)</label>
                <input type="number" id="floorElevation" step="0.05">
              </div>
              <div class="form-group">
                <label>Slab Thickness (m)</label>
                <input type="number" id="floorThickness" step="0.05">
              </div>
            </div>
            <div class="form-group">
              <label>Floor Tone Color</label>
              <input type="color" id="floorColor" value="#2c3e50">
            </div>
          </div>
          <div id="wallFields" style="display: none;">
            <div class="form-row">
              <div class="form-group">
                <label>Bottom Z (m) (0 = Floor, >0 = Arch Open Bottom)</label>
                <input type="number" id="wallBottomZ" step="0.1">
              </div>
              <div class="form-group">
                <label>Top Z (m) (e.g. 14m or 4.2m)</label>
                <input type="number" id="wallTopZ" step="0.1">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Thickness (m)</label>
                <input type="number" id="wallThickness" step="0.05">
              </div>
              <div class="form-group">
                <label>Wall Color</label>
                <input type="color" id="wallColor" value="#475569">
              </div>
            </div>
            <div class="form-group checkbox-group" style="margin-top: 6px;">
              <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer;">
                <input type="checkbox" id="wallSeeThrough">
                <span>See-Through (Translucent in 3D Mode)</span>
              </label>
            </div>
          </div>
          <div id="cameraFields" style="display: none;">
            <div class="form-row">
              <div class="form-group">
                <label>Height Z (m)</label>
                <input type="number" id="camHeight" step="0.1">
              </div>
              <div class="form-group">
                <label>Base Pan (°)</label>
                <input type="number" id="camPan" step="1">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Base Tilt (°)</label>
                <input type="number" id="camTilt" step="1">
              </div>
              <div class="form-group">
                <label>HFOV (°)</label>
                <input type="number" id="camHfov" value="67" step="1">
              </div>
            </div>
          </div>
          <div id="occluderFields" style="display: none;">
            <div class="form-group">
              <label>Kind</label>
              <select id="occKind">
                <option value="box">Parametric Box</option>
                <option value="table">4-Legged Table (Open Underneath)</option>
                <option value="cylinder">Parametric Cylinder</option>
                <option value="mesh">Mesh (.glb asset)</option>
              </select>
            </div>
            <div class="form-group" id="meshUrlGroup">
              <label>GLB Asset URL / Path</label>
              <input type="text" id="occMeshUrl" placeholder="models/pulpit-facade.glb">
            </div>
            <div class="form-row" id="occDimRow">
              <div class="form-group">
                <label>Width (m)</label>
                <input type="number" id="occWidth" step="0.1">
              </div>
              <div class="form-group">
                <label>Depth (m)</label>
                <input type="number" id="occDepth" step="0.1">
              </div>
              <div class="form-group">
                <label>Height (m)</label>
                <input type="number" id="occHeight" step="0.1">
              </div>
            </div>
            <div class="form-group">
              <label>Base Elevation Z (m)</label>
              <input type="number" id="occBaseZ" step="0.1">
            </div>
          </div>
          <button id="btnDeleteItem" class="btn danger">Delete Item</button>
        </div>
      </div>

      <hr>

      <!-- Scene Hierarchy / Object List (Under Inspector) -->
      <div id="hierarchySection">
        <div class="hierarchy-header">
          <h3>Scene Objects</h3>
          <span id="objectCountBadge" class="count-badge">0</span>
        </div>
        <div id="sceneObjectList" class="scene-object-list">
          <!-- Populated dynamically -->
        </div>
      </div>

      <hr>

      <!-- Validation Output -->
      <div id="validationBox">
        <h3>Schema Validation</h3>
        <div id="validationStatus" class="status-badge ok">Model Valid</div>
        <ul id="validationIssuesList"></ul>
      </div>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
